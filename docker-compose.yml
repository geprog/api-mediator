# Local development environment for the API Mediator.
#
# Provides the PostgreSQL database the mediator persists its data model into
# (see docs/architecture/data-model.md). The mediator app itself runs on the
# host during development, as does Ollama (the local LLM backing the Mapping
# Engine) — see DEVELOPMENT.md.
#
#   docker compose up -d          # start Postgres
#   docker compose down           # stop (keeps data)
#   docker compose down -v        # stop and wipe the database volume
#
# Values are read from a local .env if present, otherwise the defaults below.

name: api-mediator

services:
  postgres:
    image: postgres:17-alpine
    container_name: api-mediator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediator}
      POSTGRES_DB: ${POSTGRES_DB:-api_mediator}
    ports:
      # Host port is configurable to avoid clashing with a Postgres already
      # listening on 5432; the container always listens on 5432 internally.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediator} -d ${POSTGRES_DB:-api_mediator}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
